version_key: construction_process_kg_schema
description: 用于需求、设计、编码、测试、部署和维护文档的受约束知识图谱抽取。 业务实体、工程追踪实体和文档证据分层保存，避免章节标题、日期、URL、接口路径和泛化短语直接污染业务图谱。
entity_types:
- key: system
  label: 系统
  description: business_graph
  properties_schema:
    type: object
    properties:
      canonical_name: string
      aliases: string[]
      version: string?
      status: enum[planned, implemented, tested, released, maintained, unknown]
    required:
    - canonical_name
- key: business_module
  label: 业务模块
  description: business_graph
  properties_schema:
    type: object
    properties:
      canonical_name: string
      module_code: enum[workbench, prejob_education, alert_resolution, material_checklist,
        issue_scan, dashboard, electronic_forms, project_personnel, operation_log]
      purpose: string?
    required:
    - canonical_name
    - module_code
- key: project
  label: 项目
  description: business_graph
  properties_schema:
    type: object
    properties:
      canonical_name: string
      project_id: string?
      status: string?
    required:
    - canonical_name
- key: organization
  label: 组织
  description: business_graph
  properties_schema:
    type: object
    properties:
      canonical_name: string
      organization_type: enum[company, department, team, owner, contractor, supervisor,
        other]
    required:
    - canonical_name
- key: person
  label: 人员
  description: business_graph
  properties_schema:
    type: object
    properties:
      canonical_name: string
      person_ref: string?
      masked_identity: string?
    required:
    - canonical_name
- key: role
  label: 角色
  description: business_graph
  properties_schema:
    type: object
    properties:
      canonical_name: string
      scope: string?
    required:
    - canonical_name
- key: business_process
  label: 业务流程
  description: business_graph
  properties_schema:
    type: object
    properties:
      canonical_name: string
      ordered_steps: string[]
      process_status: enum[planned, active, deprecated, unknown]
    required:
    - canonical_name
    - ordered_steps
- key: business_object
  label: 业务对象
  description: business_graph
  properties_schema:
    type: object
    properties:
      canonical_name: string
      object_type: enum[person_profile, education_record, attendance_record, alert,
        scan_task, scan_result, material_catalog, material_item, file_asset, payroll_record,
        team_asset_record, expense_advance_record, output_value_record, operation_log]
      business_period: string?
      status: string?
      source_identifier: string?
    required:
    - canonical_name
    - object_type
- key: requirement
  label: 需求
  description: engineering_traceability
  properties_schema:
    type: object
    properties:
      canonical_name: string
      requirement_id: string?
      requirement_text: string
      requirement_type: enum[functional, non_functional, security, data, acceptance,
        operational]
      status: enum[proposed, confirmed, pending_confirmation, implemented, verified,
        unknown]
    required:
    - canonical_name
    - requirement_text
    - requirement_type
- key: service_component
  label: 服务组件
  description: engineering_traceability
  properties_schema:
    type: object
    properties:
      canonical_name: string
      component_type: enum[application_service, analysis_service, integration_service,
        shared_component, access_service, database, cache, message_queue, file_storage,
        authentication, gateway, monitoring]
      version: string?
    required:
    - canonical_name
    - component_type
- key: technology_component
  label: 技术组件
  description: engineering_traceability
  properties_schema:
    type: object
    properties:
      canonical_name: string
      category: enum[language, framework, library, database, cache, message_queue,
        auth, build_tool, reporting, utility]
      version: string?
    required:
    - canonical_name
- key: endpoint
  label: 接口端点
  description: engineering_traceability
  properties_schema:
    type: object
    properties:
      canonical_name: string?
      method: enum[GET, POST, PUT, PATCH, DELETE, OTHER]
      path: string
      owner_component: string
      purpose: string?
    required:
    - method
    - owner_component
    - path
- key: test_case
  label: 测试用例
  description: engineering_traceability
  properties_schema:
    type: object
    properties:
      case_id: string
      canonical_name: string
      test_type: enum[ui, read_only, functional, security, deployment_smoke, integration,
        regression]
      result: enum[passed, failed, blocked, not_run]
      evidence_refs: string[]
    required:
    - canonical_name
    - case_id
    - result
- key: deployment_environment
  label: 部署环境
  description: engineering_traceability
  properties_schema:
    type: object
    properties:
      canonical_name: string
      environment_type: enum[test, preproduction, production]
      status: enum[planned, ready, active, retired, unknown]
    required:
    - canonical_name
    - environment_type
- key: release
  label: 发布版本
  description: engineering_traceability
  properties_schema:
    type: object
    properties:
      version: string
      release_date: date
      status: enum[planned, released, rolled_back, retired]
      build_id: string?
      scope: string?
    required:
    - release_date
    - version
- key: maintenance_issue
  label: 维护问题
  description: engineering_traceability
  properties_schema:
    type: object
    properties:
      issue_id: string
      canonical_name: string
      severity: enum[critical, major, normal, suggestion]
      status: enum[open, investigating, resolved, closed]
      discovered_at: datetime?
      closed_at: datetime?
    required:
    - canonical_name
    - issue_id
    - severity
    - status
- key: security_control
  label: 安全控制
  description: engineering_traceability
  properties_schema:
    type: object
    properties:
      canonical_name: string
      control_type: enum[authentication, authorization, masking, audit, export_control,
        file_control, backup, recovery, configuration_secret, network_access, retention]
      status: enum[planned, implemented, verified, unknown]
    required:
    - canonical_name
    - control_type
- key: document
  label: 文档
  description: knowledge_assets
  properties_schema:
    type: object
    properties:
      title: string
      document_type: enum[requirements, design, coding, test_report, deployment_plan,
        maintenance_plan, other]
      version: string?
      compiled_by: string?
      reviewed_by: string?
      compiled_date: date?
    required:
    - document_type
    - title
- key: section
  label: 文档章节
  description: knowledge_assets
  properties_schema:
    type: object
    properties:
      heading: string
      section_path: string
      document_ref: string
      page_start: integer?
      page_end: integer?
    required:
    - document_ref
    - heading
    - section_path
- key: evidence
  label: 证据
  description: knowledge_assets
  properties_schema:
    type: object
    properties:
      document_ref: string
      section_path: string
      page: integer?
      text_span: string
      bbox: number[]?
      extraction_mode: enum[native_text, ocr, layout, vision, manual]
      confidence: number
    required:
    - document_ref
    - section_path
    - text_span
