[project]
name = "vector-knowledge"
version = "0.1.0"
description = "Multi-tenant vector knowledge base service with Dify-compatible retrieval API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "python-dotenv>=1.0",
    "langchain-text-splitters>=0.2",
    "psycopg2-binary>=2.9",
    "fastapi-users[sqlalchemy]>=13.0",
    "casbin>=1.36",
    "casbin-sqlalchemy-adapter>=1.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
# 图片/扫描件 OCR（按库 ocr_enabled 开启时才需要）：pip install -e .[ocr]
# 含 DOCX 内嵌图片 OCR 与 PDF 扫描页 OCR（pypdfium2 渲染扫描页 → RapidOCR 识别）。
ocr = [
    "rapidocr_onnxruntime>=1.2",
    "pypdfium2",
    "Pillow>=10",
]
object-storage = [
    "minio>=7.2",
    "oss2>=2.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
