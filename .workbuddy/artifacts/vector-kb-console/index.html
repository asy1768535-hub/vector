<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Vector KB Console — 向量知识检索底座管理控制台：知识库管理、文档摄入、语义检索、任务监控。">
  <meta name="color-scheme" content="dark light">
  <title>Vector KB Console · 向量知识检索底座</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230e9384'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%23fff'/%3E%3Ccircle cx='16' cy='8' r='2' fill='%23fff'/%3E%3Ccircle cx='8' cy='16' r='2' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23fff'/%3E%3Cpath d='M9.4 9.4l5.2 5.2M14.6 9.4l-5.2 5.2' stroke='%23fff' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- 首屏加载占位（JS 加载前的静态骨架，避免白屏） -->
    <div style="display:grid;grid-template-columns:264px 1fr;min-height:100dvh">
      <div style="border-right:1px solid var(--border);background:var(--bg-elevated)"></div>
      <div>
        <div style="height:64px;border-bottom:1px solid var(--border)"></div>
        <div style="padding:28px 24px">
          <div class="skeleton" style="height:32px;width:220px;border-radius:8px"></div>
          <div class="skeleton sk-line" style="width:min(480px,80%)"></div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px">
            <div class="skeleton sk-card"></div>
            <div class="skeleton sk-card"></div>
            <div class="skeleton sk-card"></div>
            <div class="skeleton sk-card"></div>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding:40px;text-align:center;font-family:sans-serif">
        此控制台需要启用 JavaScript 才能运行。
      </div>
    </noscript>
  </div>

  <!-- 模块按依赖顺序加载：工具 -> API -> 视图 -> 应用壳 -->
  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/libraries.js"></script>
  <script src="js/views/documents.js"></script>
  <script src="js/views/search.js"></script>
  <script src="js/views/import.js"></script>
  <script src="js/views/jobs.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
